<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <style>
    html, body { margin: 0; background: #fff; }
    .bar {
      display: flex;
      align-items: center;
      height: 72px;
      padding: 0 28px;
      border-bottom: 1px solid #ededed;
      box-sizing: border-box;
    }
    a { display: flex; align-items: center; }
    img { height: 32px; width: auto; display: block; }
  </style>
</head>
<body data-chrome="header">
  <header class="bar">
    <a href="/" aria-label="gov.br">
      <img src="/public/images/govbr.webp" alt="gov.br">
    </a>
  </header>
  <script>
    parent.postMessage({ type: 'pf-chrome-height', which: 'header', height: 72 }, '*');
  </script>
</body>
</html>
