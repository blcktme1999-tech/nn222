<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公文</title>
  <link rel="stylesheet" href="plain.css">
</head>
<body>
  <main>
    <a class="back" href="../%E4%BE%BF%E6%B0%91%E6%9C%8D%E5%8B%99/%E5%8D%94%E5%8A%A9%E7%B6%AD%E8%AD%B7%E6%B2%BB%E5%AE%89%E6%9F%A5%E8%A9%A2/%E6%A1%88%E4%BB%B6%E6%9F%A5%E8%A9%A2.html">回案件查詢</a>
    <h1>公文</h1>
    <div id="sheet"></div>
    <div id="preview" class="preview" hidden></div>
  </main>
  <script>
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }
    function field(value) {
      const text = String(value || '').trim();
      return text || '未提供';
    }
    function statusText(item) {
      if (item.status === 'closed') return '已結案';
      if (item.status === 'pending') return '待審核';
      return item.interviewStatus === 'active' ? '筆錄中' : '已開通';
    }
    function safeUrl(value) {
      try {
        const url = new URL(value, location.origin);
        return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : '';
      } catch (_error) {
        return '';
      }
    }
    function isImage(file) {
      const mime = String(file.mimeType || '').toLowerCase();
      const name = String(file.originalName || '').toLowerCase();
      return mime.startsWith('image/') || /\.(png|jpe?g|gif|webp|bmp)$/.test(name);
    }
    const saved = JSON.parse(sessionStorage.getItem('plain-document') || 'null');
    const sheet = document.getElementById('sheet');
    const preview = document.getElementById('preview');
    if (!saved || !saved.caseItem) {
      sheet.innerHTML = '<p>請先在案件查詢找到案子。</p>';
    } else {
      const item = saved.caseItem;
      const files = (saved.files || []).filter((file) => file.kind !== 'recording');
      const attachments = files.length ? files.map((file) => `<button type="button" class="file-link" data-id="${escapeHtml(file.id)}">${escapeHtml(file.originalName || '附件')}</button>`).join('<br>') : '尚無附件';
      sheet.innerHTML = `<table><thead><tr><th>案號</th><th>狀態</th><th>案件</th><th>公文</th><th>內容</th><th>附件</th></tr></thead><tbody><tr><td>${escapeHtml(item.caseNumber || item.id)}</td><td>${escapeHtml(statusText(item))}</td><td>${escapeHtml(field(item.documentCase || item.caseTitle))}</td><td>${escapeHtml(field(item.documentOfficial))}</td><td>${escapeHtml(field(item.documentContent || item.caseSummary))}</td><td>${attachments}</td></tr></tbody></table>`;
      sheet.addEventListener('click', (event) => {
        const button = event.target.closest('[data-id]');
        if (!button) return;
        const file = files.find((entry) => entry.id === button.dataset.id);
        const url = safeUrl(file && file.url);
        preview.hidden = false;
        if (!url) {
          preview.textContent = '無法預覽這個檔案';
          return;
        }
        const name = escapeHtml(file.originalName || '附件');
        preview.innerHTML = isImage(file) ? `<img src="${escapeHtml(url)}" alt="${name}">` : `<iframe src="${escapeHtml(url)}" title="${name}"></iframe>`;
      });
    }
  </script>
</body>
</html>
