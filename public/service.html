<!DOCTYPE html>
<html lang="zh-Hant-TW"><style id=pf-chrome-hide>header.app-header,footer.service-footer,header.top,header.ey-topbar,footer.ey-bottom,header#top,div.menu,footer.wow,.fatfoot,#bg1,.into,.backtop,.fast.left,.fast.right{display:none!important}.innerpage:before{content:none!important;display:none!important;height:0!important;background:none!important}body.home,body.home #bg1{background-image:none!important;background-color:#fff!important}</style>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>警政服務系統｜民眾服務入口</title>
  <link rel="stylesheet" href="/public/styles.css">
</head>
<body data-entry="citizen" class="police-service"><script>(function () {
  if (window.__pfChrome) return;
  window.__pfChrome = true;

  var logoHeader = document.body.dataset.pfHeader === 'logo';
  function frame(which, title, background) {
    var iframe = document.createElement('iframe');
    var file = which === 'header' && logoHeader ? 'pf-backend-header-frame.html' : 'pf-' + which + '-frame.html';
    iframe.src = '/public/' + file + '?v=10';
    iframe.title = title;
    iframe.setAttribute('scrolling', 'no');
    iframe.style.cssText = 'display:block;width:100%;border:0;background:' + background + ';';
    iframe.style.height = which === 'header' ? (logoHeader ? '72px' : '210px') : '640px';
    if (which === 'header') {
      iframe.style.position = 'sticky';
      iframe.style.top = '0';
      iframe.style.zIndex = '10000';
    }
    return iframe;
  }

  var header = document.querySelector('iframe[data-pf-chrome="header"]') || frame('header', 'Polícia Federal', '#fff');
  var footer = document.querySelector('iframe[data-pf-chrome="footer"]') || frame('footer', 'Rodapé da Polícia Federal', '#071d41');
  header.dataset.pfChrome = 'header';
  footer.dataset.pfChrome = 'footer';
  if (!header.parentNode) document.body.prepend(header);

  function placeFooter() {
    if (!footer.parentNode) document.body.appendChild(footer);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', placeFooter);
  else placeFooter();

  window.addEventListener('message', function (event) {
    var data = event.data || {};
    if (data.type !== 'pf-chrome-height') return;
    var target = data.which === 'header' ? header : footer;
    if (event.source !== target.contentWindow) return;
    var height = Number(data.height);
    if (!height) return;
    target.style.height = Math.ceil(height) + 'px';
  });
})();
</script>
  <a class="skip-link" href="#mainContent">跳至主要內容</a>
  <header class="app-header">
    <a class="service-brand" href="/" aria-label="回主頁">
      <img class="brand-top-image" src="/public/images/cib-header.png" alt="內政部警政署刑事警察局">
      <div>
        <p class="agency-name">內政部警政署</p>
        <h1>警政服務系統</h1>
      </div>
    </a>
    <div class="header-actions">
      <p class="header-context">民眾線上服務入口</p>
      <a class="header-context official-home-link" href="/">回官網首頁</a>
    </div>
  </header>

  <main id="mainContent" class="layout" tabindex="-1">
    <section id="citizenPanel" class="panel active">
      <div id="citizenEntry" class="surface intro-surface citizen-entry">
        <form id="reportGate" class="stacked-form">
          <h2>線上筆錄</h2>
          <p><a href="/admin">管理登入</a></p>
          <div id="stepId">
            <label for="gateCertificate">身分證字號</label>
            <input id="gateCertificate" type="text" autocomplete="off" maxlength="20" required>
            <button class="entry-submit" type="submit">確認身分</button>
          </div>
          <div id="stepCase" class="hidden">
            <p>請選擇自己的案件</p>
            <div id="gateCases"></div>
          </div>
          <div id="stepSign" class="hidden">
            <p id="gateNumber">筆錄編號 <strong id="gateNumberValue"></strong></p>
            <div class="sign-row">
              <canvas id="gatePad" width="460" height="160"></canvas>
              <p>保證筆錄是如實回答</p>
            </div>
            <button type="button" id="gateClear">清除簽名</button>
            <button type="button" id="gateStart" disabled>同意</button>
          </div>
          <p id="gateStatus" class="notice" role="status"></p>
        </form>
        <form id="citizenForm" hidden>
          <input name="citizenName">
          <input name="certificateNumber">
          <input name="caseNumber">
        </form>
        <div id="entryHelp" class="entry-disclaimer">
          <strong>服務使用提醒</strong>
          <p>線上筆錄需允許瀏覽器使用攝影機與麥克風；請在安全、安靜的環境操作，並妥善保護個人資料。</p>
          <p>如遇緊急事故或人身安全危險，請立即撥打 <a href="tel:110">110</a>，勿等待線上審核。</p>
        </div>
      </div>
      <div id="citizenStatus" class="notice hidden" role="status" aria-live="polite" aria-atomic="true"></div>
      <div id="citizenWorkspace" class="workspace hidden"></div>
    </section>

    <section id="staffPanel" class="panel">
      <div id="staffLogin" class="surface compact">
        <h2>客服登入</h2>
        <form id="staffLoginForm" class="stacked-form">
          <label>帳號<input name="username" type="text" autocomplete="username" required></label>
          <label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
          <button type="submit">登入客服端</button>
        </form>
        <p class="muted">限授權服務人員使用，請以配發帳號登入。</p>
      </div>
      <div id="staffWorkspace" class="workspace hidden"></div>
    </section>

    <section id="adminPanel" class="panel">
      <div class="surface compact">
        <h2>管理端</h2>
        <p class="muted">管理員可審核民眾服務、建立客服帳號，並檢視所有案件紀錄。</p>
      </div>
      <div id="adminWorkspace" class="workspace hidden"></div>
    </section>
  </main>

  <footer class="service-footer">
    <p>內政部警政署｜警政服務系統</p>
    <p>請妥善保護個人資料；緊急報案請撥 <a href="tel:110">110</a>。</p>
  </footer>

  <template id="caseWorkspaceTemplate">
    <div class="case-shell">
      <aside class="case-list-card">
        <div class="section-heading">
          <h2>案件列表</h2>
          <button type="button" class="secondary" data-action="refreshCases">重新整理</button>
        </div>
        <div class="case-tools">
          <label>搜尋案件<input type="search" data-action="searchCases" placeholder="姓名或案號" autocomplete="off"></label>
          <label>案件狀態<select data-action="filterCases">
            <option value="all">全部案件</option>
            <option value="pending">待審核</option>
            <option value="open">已開通</option>
            <option value="active">筆錄中</option>
            <option value="closed">已結案</option>
          </select></label>
        </div>
        <p class="case-count">案件數量 <span data-slot="caseCount" aria-live="polite">—</span></p>
        <div data-slot="caseList" class="case-list"></div>
      </aside>
      <section class="case-detail" aria-label="案件工作區">
        <div data-slot="caseSummary" class="surface empty-state">請選擇案件</div>
        <div data-slot="media" class="surface hidden"></div>
        <div data-slot="conversation" class="surface hidden"></div>
      </section>
    </div>
  </template>

  <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
  <script src="/public/video-session.js"></script>
  <style>
    .sign-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .sign-row canvas { border: 1px solid #bbb; background: #fff; touch-action: none; width: min(100%, 460px); height: 160px; }
    #openCaseQuery { position: fixed; right: 16px; bottom: 16px; z-index: 40; }
    #caseQueryDrawer { position: fixed; top: 0; right: 0; width: min(480px, 100%); height: 100%; background: #fff; z-index: 50; box-shadow: -4px 0 16px rgba(0,0,0,.18); display: flex; flex-direction: column; }
    #caseQueryDrawer header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #268726; color: #fff; }
    #caseQueryDrawer[hidden] { display: none; }
    #caseQueryBody { flex: 1; overflow: auto; padding: 16px; }
    #caseQueryBody table { width: 100%; border-collapse: collapse; }
    #caseQueryBody th, #caseQueryBody td { border-bottom: 1px solid #ddd; padding: 8px 6px; text-align: left; vertical-align: top; white-space: pre-wrap; }
    #caseQueryBody th { width: 5rem; }
  </style>
  <button type="button" id="openCaseQuery">案件查詢</button>
  <aside id="caseQueryDrawer" hidden>
    <header><strong>案件查詢</strong><button type="button" id="closeCaseQuery">關閉</button></header>
    <div id="caseQueryBody"></div>
  </aside>
  <script src="/public/app.js"></script>
  <script>
    const gate = document.getElementById('reportGate');
    const gateStatus = document.getElementById('gateStatus');
    const stepCase = document.getElementById('stepCase');
    const stepSign = document.getElementById('stepSign');
    const gateCases = document.getElementById('gateCases');
    const citizenForm = document.getElementById('citizenForm');
    const startButton = document.getElementById('gateStart');
    let matchedCases = [];
    let selectedCase = null;
    function bindPad(canvas, onInk) {
      const ctx = canvas.getContext('2d');
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#111';
      let drawing = false;
      const point = (event) => {
        const rect = canvas.getBoundingClientRect();
        return { x: (event.clientX - rect.left) * (canvas.width / rect.width), y: (event.clientY - rect.top) * (canvas.height / rect.height) };
      };
      canvas.addEventListener('pointerdown', (event) => {
        drawing = true;
        canvas.setPointerCapture(event.pointerId);
        const p = point(event);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + 0.1, p.y + 0.1);
        ctx.stroke();
        onInk(true);
      });
      canvas.addEventListener('pointermove', (event) => {
        if (!drawing) return;
        const p = point(event);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      });
      const stop = () => { drawing = false; };
      canvas.addEventListener('pointerup', stop);
      canvas.addEventListener('pointercancel', stop);
      return { clear() { ctx.clearRect(0, 0, canvas.width, canvas.height); onInk(false); } };
    }
    const pad = bindPad(document.getElementById('gatePad'), (hasInk) => { startButton.disabled = !hasInk; });
    document.getElementById('gateClear').addEventListener('click', () => pad.clear());
    gate.addEventListener('submit', async (event) => {
      event.preventDefault();
      gateStatus.textContent = '查詢中…';
      stepCase.classList.add('hidden');
      stepSign.classList.add('hidden');
      selectedCase = null;
      pad.clear();
      const certificateNumber = document.getElementById('gateCertificate').value.trim();
      try {
        const response = await fetch('/api/citizen/by-certificate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ certificateNumber }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '查無資料');
        matchedCases = Array.isArray(data.cases) ? data.cases : [];
        if (!matchedCases.length) throw new Error('查無資料');
        gateStatus.textContent = '請選擇案件';
        stepCase.classList.remove('hidden');
        const esc = (value) => String(value ?? '').replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
        gateCases.innerHTML = matchedCases.map((item) => `<button type="button" class="secondary" data-id="${esc(item.id)}">姓名 ${esc(item.citizenName)}　筆錄編號 ${esc(item.caseNumber)}${item.status === 'open' ? '' : '（尚未開通）'}</button>`).join('');
      } catch (error) {
        gateStatus.textContent = error.message || '查無資料';
      }
    });
    gateCases.addEventListener('click', (event) => {
      const button = event.target.closest('[data-id]');
      if (!button) return;
      selectedCase = matchedCases.find((item) => item.id === button.dataset.id);
      if (!selectedCase || selectedCase.status !== 'open') { gateStatus.textContent = '案件尚未開通'; return; }
      citizenForm.citizenName.value = selectedCase.citizenName || '';
      citizenForm.certificateNumber.value = document.getElementById('gateCertificate').value.trim();
      citizenForm.caseNumber.value = selectedCase.caseNumber || '';
      document.getElementById('gateNumberValue').textContent = selectedCase.caseNumber || '';
      stepSign.classList.remove('hidden');
      pad.clear();
      gateStatus.textContent = '請先簽名，再按同意';
    });
    startButton.addEventListener('click', async () => {
      if (!selectedCase || startButton.disabled) return;
      startButton.disabled = true;
      try {
        const response = await fetch('/api/citizen/signature', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ citizenName: citizenForm.citizenName.value, certificateNumber: citizenForm.certificateNumber.value, caseNumber: citizenForm.caseNumber.value, kind: 'interview', image: document.getElementById('gatePad').toDataURL('image/png') }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '簽名檔無法儲存');
        document.getElementById('citizenEntry').classList.add('hidden');
        citizenForm.requestSubmit();
      } catch (error) {
        gateStatus.textContent = error.message || '簽名檔無法儲存';
        startButton.disabled = false;
      }
    });
    const drawer = document.getElementById('caseQueryDrawer');
    const queryBody = document.getElementById('caseQueryBody');
    function escapeCell(value) {
      return String(value || '').trim().replace(/[&<>]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[char])) || '未提供';
    }
    document.getElementById('openCaseQuery').addEventListener('click', async () => {
      drawer.hidden = false;
      const citizenName = citizenForm.citizenName.value.trim();
      const certificateNumber = citizenForm.certificateNumber.value.trim();
      const caseNumber = citizenForm.caseNumber.value.trim();
      if (!citizenName || !certificateNumber || !caseNumber) {
        queryBody.textContent = '請先進入筆錄';
        return;
      }
      queryBody.textContent = '讀取中…';
      try {
        const response = await fetch('/api/citizen/query', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ citizenName, certificateNumber }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '查詢失敗');
        const picked = (data.cases || []).find((item) => String(item.caseNumber || '').trim().toUpperCase() === caseNumber.toUpperCase());
        if (!picked) throw new Error('查無資料');
        queryBody.innerHTML = `<table><tr><th>案號</th><td>${escapeCell(picked.caseNumber)}</td></tr><tr><th>公文</th><td>${escapeCell(picked.documentOfficial)}</td></tr><tr><th>案由</th><td>${escapeCell(picked.caseReason)}</td></tr><tr><th>單位</th><td>${escapeCell(picked.caseUnit)}</td></tr><tr><th>命令</th><td>${escapeCell(picked.caseOrder)}</td></tr></table>`;
      } catch (error) {
        queryBody.textContent = error.message || '查詢失敗';
      }
    });
    document.getElementById('closeCaseQuery').addEventListener('click', () => { drawer.hidden = true; });
  </script>
<script src="/public/site-content.js" defer></script>
</body>
</html>
